
<div class="authentication-wrapper authentication-basic container-p-y p-4 p-sm-0" style="background-image: url('/assets/img/front-pages/landing-page/pics-layout.jpg');background-size: cover;">

  <div class="py-6">
    <!-- Login -->
    <div class="container p-md-7 p-1">
      <!-- Logo -->
      <div class="app-brand justify-content-center mt-5">
        <a href="/" class="app-brand-link gap-2">
          <img src="/assets/img/logo/quaere-software-company-logo.png" width="250">

        </a>

      </div>
      <div class="app-brand justify-content-center mb-10 mt-5">
        <div class="text-center">
          <h4 style="    font-size: 32px;
    color: #fff;
    font-weight: 900;">Quaere ETechnologies Pvt. Ltd.</h4>
          <p style="color: #fff;">
            7th Floor, Cyber Tower, Pickup Road, Vibhuti Khand, Gomti Nagar, Lucknow-226010 (Uttar Pradesh)
          </p>
        </div>
      </div>
      <!-- /Logo -->

      <div class="row mb-12 g-6">
        <div class="col-md-12">
          <div class="row">

            <div class="col-lg-4" *ngFor="let branch of branchList">
              <div class="card card-100 text-center">
                <div class="card-body">
                  <div class="mb-4">
                    <img src="/assets/img/logo/icomoon-free_office.svg" width="60">
                  </div>

                  <h5 class="card-title">{{ branch.name }}</h5>

                  <p class="card-text">
                    {{ branch.description || 'Central administration and monitoring access.' }}
                  </p>

                  <button class="btn btn-primary waves-effect waves-light" (click)="goToDashboard(branch)">
                    Go to Dashboard
                  </button>
                </div>
              </div>
            </div>

          </div>
        </div>
      </div>
