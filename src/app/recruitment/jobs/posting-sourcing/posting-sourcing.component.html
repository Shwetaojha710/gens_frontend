
<div class="container-fluid mt-3">
  <div class="row">
    <div class="col-md-3" *ngFor="let item of jobs">
      <div class="card mb-6 border border-2" [ngClass]="getCardBorderClass(item?.status)">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start text-capitalize">
            <h5 class="text-primary mb-0">
              {{item?.job_title}}
            </h5>
            <span class="badge rounded-pill px-3 py-2 text-uppercase" [ngClass]="getStatusBadgeClass(item?.status)">
              {{ getStatusLabel(item?.status) }}
            </span>
          </div>




          <ul class="list-unstyled g-2 my-3">
            <li class="mb-2 d-flex align-items-center"><i
                class="icon-base ri ri-circle-fill icon-10px text-body me-2"></i><strong>📍 Job Location </strong>
              :<span class="text-success"> {{item?.location}}</span></li>
            <li class="mb-2 d-flex align-items-center"><i
                class="icon-base ri ri-circle-fill icon-10px text-body me-2"></i><span><strong>No Of Opening </strong> :
                {{item?.no_of_opening}}</span></li>

            <li class="mb-2 d-flex align-items-center"><i
                class="icon-base ri ri-circle-fill icon-10px text-body me-2"></i><span><strong>Notice Period </strong> :
                {{item?.notice_period}}</span></li>

          </ul>

          <div class="d-flex justify-content-between align-items-center mb-1 fw-medium text-heading">
            Skills Required : <br>

          </div>


          <div class="d-flex flex-wrap gap-2 mb-3">
            <span
              *ngFor="let skill of getSkillsList(item?.skills)"
              class="badge rounded-pill bg-label-primary"
            >
              {{ skill }}
            </span>
            <span *ngIf="!getSkillsList(item?.skills).length" class="text-muted">-</span>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-1 fw-medium text-heading">
            Job Description : <br>

          </div>

          <p> {{item?.job_description}}</p>
          <div class="job-action-row">
            <button *ngIf="canPublish(item)" type="button" class="job-action-btn publish-btn"
              (click)="publish(item,'open')">
              <i class="ri-rocket-line"></i>
              <span>Publish</span>
            </button>
            <button *ngIf="canClose(item)" type="button" class="job-action-btn close-btn"
              (click)="publish(item,'close')">
              <i class="ri-lock-line"></i>
              <span>Close</span>
            </button>
          </div>
          <div *ngIf="item?.url" class="mt-2 d-flex align-items-center gap-2">
            <a [href]="normalizeUrl(item.url)" target="_blank" rel="noopener noreferrer"
              class="btn btn-sm btn-outline-primary d-flex align-items-center gap-1" title="Open Job URL">
              <i class="ri-external-link-line"></i>
              <span>Open</span>
            </a>
            <button type="button" class="btn btn-sm d-flex align-items-center gap-1"
              [ngClass]="copied[item.id] ? 'btn-success' : 'btn-outline-secondary'"
              [title]="copied[item.id] ? 'Copied!' : 'Copy Job URL'"
              (click)="copy(item.url, item.id)">
              <i [class]="copied[item.id] ? 'ri-check-line' : 'ri-file-copy-line'"></i>
              <span>{{ copied[item.id] ? 'Copied!' : 'Copy URL' }}</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>


</div>
