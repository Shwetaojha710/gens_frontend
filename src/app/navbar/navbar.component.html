<!-- Vertical Sidebar Menu -->
<aside id="layout-menu" class="layout-menu menu-vertical menu"   [ngClass]="{ 'collapsed': isCollapsed }">

  <!-- Brand Logo -->
<div class="app-brand demo">
  <a routerLink="/layout/dashboard" class="app-brand-link">
    <span class="app-brand-logo demo">
      <i class="ri ri-briefcase-4-line" style="font-size: 1.5rem; color: var(--bs-primary);"></i>
    </span>
    <span class="app-brand-text demo menu-text fw-semibold ms-2">HRMS</span>
  </a>

  <!-- Toggle Button -->
  <a href="javascript:void(0);"
     class="layout-menu-toggle menu-link text-large ms-auto"
     (click)="toggleSidebar()">
    <i class="ri"
       [ngClass]="isCollapsed ? 'ri-menu-unfold-line' : 'ri-menu-fold-line'">
    </i>
  </a>
</div>

  <div class="menu-inner-shadow"></div>

  <!-- Menu Items -->
  <ul class="menu-inner py-1">
    <ng-container *ngFor="let menu of menuItems">

      <!-- Menu Item with no children -->
      <ng-container *ngIf="!menu.children || !menu.children.length">
        <li class="menu-item" [class.active]="isLinkActive(menu.link)">
          <a class="menu-link" [routerLink]="menu.link" routerLinkActive="active">
            <i class="menu-icon icon-base ri" [ngClass]="menu.icon"></i>
            <div>{{ menu.title }}</div>
          </a>
        </li>
      </ng-container>

      <!-- Menu Item with children (collapsible) -->
      <ng-container *ngIf="menu.children && menu.children.length">
        <li class="menu-item"
            [class.active]="isAnyChildActive(menu.children)"
            [class.open]="openMenu === menu.title">
          <a href="javascript:void(0);"
             class="menu-link menu-toggle"
             (click)="toggleMenu(menu.title)">
            <i class="menu-icon icon-base ri" [ngClass]="menu.icon"></i>
            <div>{{ menu.title }}</div>
          </a>
          <ul class="menu-sub">
            <ng-container
              *ngTemplateOutlet="renderSubmenu; context: { $implicit: menu.children, parentTitle: menu.title }">
            </ng-container>
          </ul>
        </li>
      </ng-container>

    </ng-container>
  </ul>

  <!-- Recursive submenu template -->
  <ng-template #renderSubmenu let-submenus let-parentTitle="parentTitle">
    <ng-container *ngFor="let sub of submenus">

      <!-- Leaf item (no children) -->
      <li class="menu-item" *ngIf="!sub.children || !sub.children.length"
          [class.active]="isLinkActive(sub.link)">
        <a class="menu-link" [routerLink]="sub.link" routerLinkActive="active">
          <i class="menu-icon icon-base ri" [ngClass]="sub.icon"></i>
          <div>{{ sub.title }}</div>
        </a>
      </li>

      <!-- Sub-item with nested children -->
      <li class="menu-item"
          *ngIf="sub.children && sub.children.length"
          [class.active]="isAnyChildActive(sub.children)"
          [class.open]="openMenu === sub.title">
        <a href="javascript:void(0);"
           class="menu-link menu-toggle"
           (click)="toggleMenu(sub.title)">
          <i class="menu-icon icon-base ri" [ngClass]="sub.icon"></i>
          <div>{{ sub.title }}</div>
        </a>
        <ul class="menu-sub">
          <ng-container
            *ngTemplateOutlet="renderSubmenu; context: { $implicit: sub.children, parentTitle: sub.title }">
          </ng-container>
        </ul>
      </li>

    </ng-container>
  </ng-template>

</aside>
